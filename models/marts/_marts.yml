models:
  - name: fct_order_lines
    description: "Verkaufspositionen aller Kanäle. Grain: eine Zeile pro Bestellposition. Beträge in Euro, netto ohne MwSt."
    columns:
      - name: order_line_id
        description: Bestellung und Position, z. B. 104711-2 oder C-001234-1
        data_tests: [unique, not_null]
      - name: order_id
        description: Bestell-, Bon- oder Rechnungsnummer (degenerierte Dimension)
      - name: date_key
        description: lokaler Bestelltag (Europe/Berlin) als YYYYMMDD
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_product'), field: product_key}
      - name: channel_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_channel'), field: channel_key}
      - name: customer_key
        description: Kunde in der am Bestelltag gültigen Version; -1 = Laufkundschaft im Café
        data_tests:
          - not_null:
              config:
                severity: warn   # Fortgeschritten: Unknown-Member einbauen, dann diese Zeile löschen
          - relationships:
              arguments: {to: ref('dim_customer'), field: customer_key}
      - name: gross_revenue
        description: Menge × Einzelpreis netto, vor Rabatt und Retoure (ohne MwSt.)
      - name: discount_amount
        description: Rabatt netto
      - name: refund_amount
        description: erstatteter Betrag netto
      - name: cost_amount
        description: Menge × Einstandspreis – für die Marge

  - name: dim_customer
    description: Konforme Kundendimension für alle Kanäle, SCD 2 für Stadt und E-Mail
    columns:
      - name: customer_key
        description: Surrogate Key des DWH, je Version; -1 = Unbekannt / Laufkundschaft
        data_tests: [unique, not_null]
      - name: segment
        description: consumer = Privatkunde, b2b = Geschäftskunde
        data_tests:
          - accepted_values:
              arguments: {values: ['consumer', 'b2b']}

  - name: dim_product
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: coffee_type
        description: Sorte (Espresso, Filter, Decaf, Cold Brew)

  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: dim_channel
    columns:
      - name: channel_key
        data_tests: [unique, not_null]
      - name: channel
        description: web = Webshop, subscription = Abo-Lieferung, cafe = eigenes Café, b2b = Rechnung an Geschäftskunden
        data_tests:
          - accepted_values:
              arguments: {values: ['web', 'subscription', 'cafe', 'b2b']}

# Bonus: fct_subscription_month (Grain: ein Abo pro Monat) – Modell und Tests selbst ergänzen.
