models:
  - name: stg_orders
    description: Bestellköpfe aus dem Shop, eine Zeile pro Bestellung (Dubletten entfernt)
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'paid', 'canceled', 'partially_refunded', 'refunded']
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['web', 'subscription']
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: stg_pos_sales
    columns:
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
  - name: stg_subscriptions
    columns:
      - name: subscription_id
        data_tests: [unique, not_null]
